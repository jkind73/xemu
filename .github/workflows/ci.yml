name: CI

on:
  # Builds start only by hand: Actions tab, CI, Run workflow.
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches-ignore:
  #     - master
  #   tags-ignore:
  #     - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}

  roswell:
    name: Roswell tests
    needs: build
    uses: xemu-project/xemu-test/.github/workflows/test-roswell.yml@wheel-202610142116
    with:
      xemu_build_configuration: release
