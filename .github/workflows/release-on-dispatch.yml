name: Release (Dispatched)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.8.137). Leave blank to auto-increment from latest."
        required: false
        type: string
        default: ""
      draft:
        description: "Create as draft (uncheck to publish immediately)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semver.outputs.next }}
    steps:
    - name: Clone tree
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
    - name: Determine new tag version
      id: semver
      run: |
        input_tag="${{ inputs.tag }}"
        if [ -n "$input_tag" ]; then
          case "$input_tag" in
            v*) next="$input_tag" ;;
            *) next="v$input_tag" ;;
          esac
        else
          latest=$(
            git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v[0-9]*.[0-9]*.[0-9]*' |
            awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -n 1
          )
          [ -z "$latest" ] && latest="v0.0.0"
          ver="${latest#v}"
          IFS=. read -r major minor patch <<< "$ver"
          next="v${major}.${minor}.$((patch+1))"
        fi
        echo "next=$next" >> "$GITHUB_OUTPUT"
    - name: Push new tag
      run: |
        git config user.name "nobody"
        git config user.email "nobody@nowhere"
        git tag -a "${{ steps.semver.outputs.next }}" -m "${{ steps.semver.outputs.next }}"
        git push origin "${{ steps.semver.outputs.next }}"

  release:
    name: Release
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      tag: ${{ needs.tag.outputs.tag }}
      draft: ${{ inputs.draft }}
